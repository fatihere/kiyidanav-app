name: kiyidanav
description: KıyıdanAv — kıyı balıkçılığı ve outdoor mağazası mobil uygulaması.
publish_to: 'none'
version: 1.12.0+18

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  app_settings: ^9.0.0
  geolocator: ^14.0.2
  audioplayers: ^6.5.0
  image_picker: ^1.1.2
  in_app_update: ^4.2.3
  package_info_plus: ^8.1.0
  home_widget: ^0.7.0
  crypto: ^3.0.6
  in_app_purchase: ^3.2.0
  # 1.12.0: haritadan mera seçimi, ekran kaydı/görüntüsü koruması
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  screen_protector: ^1.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/sounds/
    - assets/data/
  fonts:
    - family: Armata
      fonts:
        - asset: assets/fonts/Armata-Regular.ttf
    # Fishkrok yazısı (her yerde aynı yazı tipi)
    - family: Lobster
      fonts:
        - asset: assets/fonts/Lobster-Regular.ttf
