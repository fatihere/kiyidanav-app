name: kiyidanav
description: KıyıdanAv — kıyı balıkçılığı ve outdoor mağazası mobil uygulaması.
publish_to: 'none'
version: 1.3.0+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  webview_flutter: ^4.10.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Armata
      fonts:
        - asset: assets/fonts/Armata-Regular.ttf
