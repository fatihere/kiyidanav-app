name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android iskeletini oluştur ve güvenlik ayarlarını uygula
        run: |
          flutter create --org com.kiyidanav --project-name kiyidanav --platforms android .
          M=android/app/src/main/AndroidManifest.xml
          # İnternet izni (yayın sürümünde varsayılan olarak yok)
          grep -q 'android.permission.INTERNET' "$M" || sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$M"
          # Uygulama adı, yedekleme kapalı, şifresiz trafik yasak
          sed -i 's/android:label="[^"]*"/android:label="KıyıdanAv" android:allowBackup="false" android:usesCleartextTraffic="false"/' "$M"
          cat "$M"

      - name: Paketleri indir
        run: flutter pub get

      - name: Simgeyi uygula
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Kod analizi
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testler
        continue-on-error: true
        run: flutter test

      - name: APK derle (karartılmış kod)
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: APK'yı indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: KiyidanAv-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
