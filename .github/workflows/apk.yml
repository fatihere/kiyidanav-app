name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android iskeletini oluştur ve güvenlik ayarlarını uygula
        run: |
          flutter create --org com.kiyidanav --project-name kiyidanav --platforms android .
          M=android/app/src/main/AndroidManifest.xml
          # İnternet izni (yayın sürümünde varsayılan olarak yok)
          grep -q 'android.permission.INTERNET' "$M" || sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$M"
          # Uygulama adı, yedekleme kapalı, şifresiz trafik yasak
          sed -i 's/android:label="[^"]*"/android:label="KıyıdanAv" android:allowBackup="false" android:usesCleartextTraffic="false"/' "$M"
          cat "$M"

      - name: Logo ve yazı tipini indir (kiyidanav.com + Google Fonts)
        run: |
          mkdir -p assets/brand assets/fonts
          curl -fsSL -o assets/brand/logo.png "https://kiyidanav.com/image/catalog/kiyidanav_logo_500x500.png"
          curl -fsSL -o assets/fonts/Armata-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/armata/Armata-Regular.ttf"
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          # Uyarlanabilir simge: logo güvenli alanda kalsın diye kenar boşluğu
          logo = Image.open('assets/brand/logo.png').convert('RGBA')
          size = 1024
          canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          inner = int(size * 0.62)
          canvas.paste(logo.resize((inner, inner), Image.LANCZOS), ((size - inner) // 2, (size - inner) // 2))
          canvas.save('assets/brand/logo_fg.png')
          big = logo.resize((1024, 1024), Image.LANCZOS)
          big.save('assets/brand/logo.png')
          PY
          ls -la assets/brand assets/fonts

      - name: Paketleri indir
        run: flutter pub get

      - name: Simgeyi uygula
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Kod analizi
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testler
        continue-on-error: true
        run: flutter test

      - name: APK derle (karartılmış kod)
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Kalıcı anahtarla imzala (güncellemeler eskisinin üzerine kurulabilsin)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          OUT=build/app/outputs/flutter-apk
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::warning::KEYSTORE_B64 / KEYSTORE_PASS eklenmemiş; APK geçici anahtarla imzalandı."
            cp "$OUT/app-release.apk" "$OUT/KiyidanAv.apk"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > /tmp/ks.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks /tmp/ks.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --ks-key-alias kiyidanav --out "$OUT/KiyidanAv.apk" "$OUT/app-release.apk"
          "$BT/apksigner" verify --print-certs "$OUT/KiyidanAv.apk" | grep -i sha-256 || true
          rm -f /tmp/ks.jks

      - name: APK'yı indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: KiyidanAv-APK
          path: build/app/outputs/flutter-apk/KiyidanAv.apk
          retention-days: 30
