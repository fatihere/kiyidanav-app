name: Günlük Reels (Bugün balık kaç metrede?)

# Her sabah uygulamanın KENDİ hesabıyla günün illerindeki meraları (test/gunluk_reels/plan.json ya da tarihe bağlı rastgele 3 il) hesaplar,
# 1080x1920 Reels videosunu üretir (test/gunluk_reels_test.dart + tool/gunluk_reels.sh) ve
# kiyidanav.com/instagram/gunluk_reels_al.php'ye gönderir. Gizli anahtar yok: sunucu GitHub'ın imzalı
# OIDC jetonunu (yalnız bu deponun main dalı) GitHub'ın açık anahtarlarıyla doğrular.
on:
  schedule:
    # GitHub zamanlanmış işleri saatlerce geciktirebiliyor; 06:30 paylaşımına yetişmesi için gece üç deneme (00:05, 02:00, 05:30 TR).
    # Aynı gün ikinci video gelirse sunucu (paylaşılmadıysa) eskisinin yerine koyar.
    # 23.11.2026: saatlerce gecikip sabah 06:25'ten sonra başlayan gece denemesi video üretmez (22.11'de 13:15'te gelip
    # gece videosunun yerine geçmişti); o gün video yoksa elle çalıştırma ya da sonraki gece denemesi üretir.
    - cron: '5 21 * * *'
    - cron: '0 23 * * *'
    - cron: '30 2 * * *'
    # 15.11.2026: kiyidanav.com/balik-durumu mera sayfaları (06:15 ve 13:15 TR; gece denemeleri de veriyi tazeler)
    - cron: '15 3 * * *'
    - cron: '15 10 * * *'
  # 23.11.2026: bu dosya main'e gönderilince bir kez çalışır (değişiklikten sonra günün videosu hemen üretilsin)
  push:
    branches: [main]
    paths: ['.github/workflows/gunluk-reels.yml']
  workflow_dispatch:
    inputs:
      sadece_mera:
        description: 'Yalnız mera sayfaları verisini üret (video yok)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: gunluk-reels
  cancel-in-progress: false

jobs:
  reels:
    # yalnız gece denemeleri ve elle çalıştırma (gündüz zamanlamaları yalnız mera sayfaları içindir)
    if: (github.event_name == 'workflow_dispatch' && !inputs.sadece_mera) || github.event_name == 'push' || github.event.schedule == '5 21 * * *' || github.event.schedule == '0 23 * * *' || github.event.schedule == '30 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Istanbul
      KIYIDANAV_SUNUCU_IP: 116.202.37.122
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Hazırlık (ffmpeg, uygulama yazı tipleri)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p assets/fonts assets/sounds assets/brand
          curl -fsSL -o assets/fonts/Armata-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/armata/Armata-Regular.ttf"
          curl -fsSL -o assets/fonts/Lobster-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/lobster/Lobster-Regular.ttf"
          flutter pub get

      - name: Geç kalan gece denemesi mi?
        id: saat
        run: |
          S=$((10#$(date +%H%M)))
          echo "Türkiye saati: $(date '+%d.%m.%Y %H:%M')"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$S" -ge 625 ] && [ "$S" -lt 2300 ]; then
            echo "atla=1" >> "$GITHUB_OUTPUT"
            echo "::warning::Gece denemesi GitHub tarafından geciktirildi ($(date +%H:%M)); paylaşım saati geçtiği için video üretilmedi."
          fi

      - name: Video üret
        if: steps.saat.outputs.atla != '1'
        run: |
          set -o pipefail
          bash tool/gunluk_reels.sh build/gunluk_reels 2>&1 | tee uretim.log || {
            # hata özeti çalışma sayfasında (GitHub girişi gerekmeden) görünsün
            grep -E "overflowed|Exception|Error:|Expected:|Actual:|SocketException|ClientException|status|HTTP" uretim.log | head -15 \
              | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }

      - name: kiyidanav.com'a gönder
        if: steps.saat.outputs.atla != '1'
        run: |
          JETON=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kiyidanav-gunluk-reels" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          # Cloudflare, GitHub sunucularından gelen isteği doğrulama sayfasıyla durdurur: video doğrudan
          # barındırma sunucusuna (cPanel paylaşılan IP) gönderilir; TLS sertifikası yine www.kiyidanav.com için doğrulanır.
          KOD=$(curl -sS -o yanit.txt -w '%{http_code}' --max-time 290 --resolve "www.kiyidanav.com:443:${KIYIDANAV_SUNUCU_IP}" \
            -H "Authorization: Bearer $JETON" -F "jeton=$JETON" \
            -F "video=@build/gunluk_reels/gunluk_reels.mp4;type=video/mp4" \
            -F "aciklama=@build/gunluk_reels/aciklama.txt;type=text/plain" \
            -F "secilen=@build/gunluk_reels/secilen.json;type=application/json" \
            -F "muzik=$(cat build/gunluk_reels/muzik.txt 2>/dev/null)" \
            https://www.kiyidanav.com/instagram/gunluk_reels_al.php)
          echo "HTTP $KOD"; head -c 2000 yanit.txt; echo
          [ "$KOD" = "200" ]

      - uses: actions/upload-artifact@v4
        if: always() && steps.saat.outputs.atla != '1'
        with:
          name: gunluk-reels
          path: build/gunluk_reels
          retention-days: 7

  # kiyidanav.com/balik-durumu: kullanıcıya açık tüm meralar, uygulamanın kendi hesabıyla (test/gunluk_reels/mera_sayfalari_test.dart)
  mera-sayfalari:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Istanbul
      KIYIDANAV_SUNUCU_IP: 116.202.37.122
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Hazırlık
        run: |
          mkdir -p assets/fonts assets/sounds assets/brand
          curl -fsSL -o assets/fonts/Armata-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/armata/Armata-Regular.ttf"
          curl -fsSL -o assets/fonts/Lobster-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/lobster/Lobster-Regular.ttf"
          flutter pub get

      - name: Mera verisini hesapla
        env:
          MERA_SAYFALARI: '1'
          MERA_SAYFALARI_CIKTI: build/mera_sayfalari
        run: flutter test test/gunluk_reels/mera_sayfalari_test.dart --plain-name "mera sayfaları verisi" --reporter expanded

      - name: kiyidanav.com'a gönder
        run: |
          JETON=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kiyidanav-mera-sayfalari" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          KOD=$(curl -sS -o yanit.txt -w '%{http_code}' --max-time 120 --resolve "www.kiyidanav.com:443:${KIYIDANAV_SUNUCU_IP}"             -H "Authorization: Bearer $JETON" -F "jeton=$JETON"             -F "veri=@build/mera_sayfalari/meralar.json;type=application/json"             https://www.kiyidanav.com/balik-durumu/al.php)
          echo "HTTP $KOD"; head -c 1000 yanit.txt; echo
          [ "$KOD" = "200" ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mera-sayfalari
          path: build/mera_sayfalari
          retention-days: 3
